primary_provider: tushare
fallback_provider: akshare
tushare:
  api_url: https://ts.gyzcloud.top/api
  requests_per_minute: 120
  attempts: 3
storage:
  sqlite_path: database/etf_system.sqlite
  parquet_root: data/parquet
update:
  rolling_refetch_window: 5
  sample_categories:
    - A股宽基
    - A股行业
    - 港股宽基
    - 港股科技
    - 港股医药
    - 商品
    - 债券

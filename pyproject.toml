[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-trading-system"
version = "0.1.0"
description = "Local A-share ETF trading guidance and backtesting workbench."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "akshare>=1.14.0",
  "tushare>=1.4.24",
  "duckdb>=1.0.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "pyarrow>=15.0.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.0",
  "nicegui>=3.14.0",
  "streamlit>=1.36.0",
  "streamlit-lightweight-charts>=0.7.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
